# MVP: n8n + Postgres (+ ngrok để có HTTPS public cho webhook Facebook)
services:
  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.2.4
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5679}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5679/}
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      n8n-db:
        condition: service_healthy

  # Bật bằng: docker compose --profile tunnel up -d
  ngrok:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: http --url=${NGROK_DOMAIN} n8n:5678
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on: [n8n]

volumes:
  n8n_db:
  n8n_data:
